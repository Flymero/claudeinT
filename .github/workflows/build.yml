name: Build APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('app/**/*.gradle*', 'app/gradle-wrapper.properties') }}

      - name: Build APK
        run: |
          if [ -f app/gradlew ]; then
            cd app && chmod +x gradlew && ./gradlew assembleDebug
          else
            echo "::warning::No Termux fork in app/ yet. Skipping APK build."
            exit 0
          fi

      - name: Upload APK
        if: success() && hashFiles('app/app/build/outputs/apk/debug/*.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: claudeint-debug
          path: app/app/build/outputs/apk/debug/*.apk

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/app/build/outputs/apk/debug/*.apk
          generate_release_notes: true
