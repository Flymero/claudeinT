<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ClaudeInT</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
</head>
<body>
  <div id="app">
    <header id="toolbar">
      <div class="status">
        <span id="conn-dot" class="dot disconnected"></span>
        <span id="conn-text">Disconnected</span>
      </div>
      <span id="session-state">idle</span>
      <button id="btn-abort" disabled>Abort</button>
    </header>

    <main id="chat"></main>

    <div id="permission-panel" class="hidden">
      <div class="perm-content">
        <div class="perm-header">Permission Request</div>
        <div id="perm-tool" class="perm-tool"></div>
        <pre id="perm-input" class="perm-input"></pre>
        <div class="perm-actions">
          <button id="btn-deny" class="btn-deny">Deny</button>
          <button id="btn-approve" class="btn-approve">Approve</button>
        </div>
      </div>
    </div>

    <footer id="input-bar">
      <textarea id="msg-input" placeholder="Send a message..." rows="1"></textarea>
      <button id="btn-send">Send</button>
    </footer>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="js/app.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/diff.js"></script>
  <script src="js/permission.js"></script>
  <script src="js/toolbar.js"></script>
</body>
</html>
